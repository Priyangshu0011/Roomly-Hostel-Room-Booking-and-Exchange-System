{% extends 'base.html' %}

{% block title %}500 · Something went wrong | Roomly{% endblock %}

{% block content %}
<section class="panel panel-pad page-error">
    <h1 class="error-code error-code-warning">500</h1>
    <h2>Something didn’t go as planned.</h2>
    <p class="error-description">Something unexpected happened while processing your request. Please try again later.</p>
    <a href="{% url 'rooms:room_list' %}" class="button">Return to room directory</a>
</section>
{% endblock %}
