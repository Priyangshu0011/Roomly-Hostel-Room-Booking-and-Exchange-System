databases:
  - name: hostel-booking-db
    databaseName: hostel_db
    user: hostel_user
    plan: 0.1c-256mb
    region: oregon

services:
  - type: web
    name: hostel-booking
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    preDeployCommand: python manage.py migrate --noinput && python manage.py setup_roles
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile -
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: hostel-booking-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: hostel-booking-redis
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: hostel-booking-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction

  - type: worker
    name: hostel-booking-worker
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        fromService:
          name: hostel-booking
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: hostel-booking-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: hostel-booking-redis
          type: keyvalue
          property: connectionString
      - key: DEBUG
        value: "false"

  - type: worker
    name: hostel-booking-beat
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config beat --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        fromService:
          name: hostel-booking
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: hostel-booking-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: hostel-booking-redis
          type: keyvalue
          property: connectionString
      - key: DEBUG
        value: "false"
